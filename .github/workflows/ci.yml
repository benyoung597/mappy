name: ci

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # Only the untagged suite runs here. The others need qmk, an ARM
      # toolchain, or a keyboard plugged into the runner.
      - name: test
        run: make test

      - name: build
        run: make build
