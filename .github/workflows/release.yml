name: release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      cli_released: ${{ steps.release.outputs['cli--release_created'] }}
      cli_tag: ${{ steps.release.outputs['cli--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs in the same workflow as release-please, on the push that merging its
  # PR produces, so GITHUB_TOKEN is enough. A separate workflow would not fire:
  # events raised by GITHUB_TOKEN do not trigger further workflows.
  binaries:
    needs: release-please
    if: needs.release-please.outputs.cli_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # linux only: detection reads /sys/bus/usb/devices, so a darwin or
      # windows build would be a binary that cannot find a keyboard.
      - name: build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w" -o mappy-linux-${{ matrix.goarch }} ./cli

      - name: upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.cli_tag }}" \
            "mappy-linux-${{ matrix.goarch }}" --clobber
