name: Release Please

on:
  push:
    branches:
      - main
      - release/**
  workflow_dispatch:
    inputs:
      target_branch:
        description: Target branch for release-please run
        required: true
        default: main
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target branch
        id: branch
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.target_branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # A PAT is preferred: pull requests opened with GITHUB_TOKEN do not
          # trigger other workflows. The build below runs in this same job, so
          # the fallback keeps things working until the secret exists.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: ${{ steps.branch.outputs.name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Attach binaries to a cli release so the tool can be run without a Go
      # toolchain. Manifest mode namespaces its outputs by package path, so
      # this gates on cli specifically - a plugin release must not trigger a
      # CLI build.
      - name: Checkout released tag
        if: ${{ steps.release.outputs['cli--release_created'] }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs['cli--tag_name'] }}

      - name: Setup Go
        if: ${{ steps.release.outputs['cli--release_created'] }}
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # linux only: the keyboard is detected by reading /sys/bus/usb/devices,
      # so a build for another OS would be one that cannot find a board.
      - name: Build binaries
        if: ${{ steps.release.outputs['cli--release_created'] }}
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w" -o "mappy-linux-$arch" ./cli
          done

      - name: Attach binaries to release
        if: ${{ steps.release.outputs['cli--release_created'] }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.release.outputs['cli--tag_name'] }}" \
            mappy-linux-amd64 mappy-linux-arm64 --clobber
